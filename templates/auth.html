<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Canteen | Campus Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f1f5f9;
            --surface: #ffffff;
            --primary: #1e40af;
            --primary-accent: #2563eb;
            --primary-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-card: 0 10px 25px -5px rgba(30, 64, 175, 0.08), 0 8px 10px -6px rgba(30, 64, 175, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-canvas);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
        }
        .brand-text {
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 { font-size: 26px; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
        p.subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }

        /* Switch Tabs */
        .toggle-box {
            display: flex;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 600;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: var(--primary-accent);
        }

        .demo-credentials {
            margin-top: 24px;
            padding: 14px 16px;
            background: var(--primary-light);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            font-size: 12px;
            color: var(--primary);
            line-height: 1.6;
        }

        .flash-msg {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: 600;
            background: #fee2e2;
            color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <div class="brand-header">
            <div class="brand-icon">&#9889;</div>
            <div class="brand-text">Forkline Campus Canteen</div>
        </div>

        <h1 id="formHeading">Sign In</h1>
        <p class="subtitle" id="formSubtitle">Enterprise Cafeteria Ordering Portal</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-msg">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <!-- Tab Switcher -->
        <div class="toggle-box">
            <button class="toggle-btn active" type="button" onclick="switchTo('login')">Sign In</button>
            <button class="toggle-btn" type="button" onclick="switchTo('register')">Create Account</button>
        </div>

        <form method="POST" action="/">
            <input type="hidden" name="action" id="actionField" value="login">

            <div class="input-group" id="fullnameGroup" style="display:none;">
                <label>Full Name</label>
                <input type="text" name="fullname" placeholder="Student Adarsh">
            </div>

            <div class="input-group">
                <label>College Email</label>
                <input type="email" name="email" value="student@college.edu" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" value="pass123" required>
            </div>

            <div class="input-group">
                <label>Access Role</label>
                <select name="role">
                    <option value="student">Student Portal</option>
                    <option value="staff">Canteen Staff / Kitchen</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Enter Campus Portal &rarr;</button>
        </form>

        <div class="demo-credentials">
            <strong>Ready Demo Access:</strong><br>
            Student: <code>student@college.edu / pass123</code><br>
            Kitchen Staff: <code>staff@college.edu / staff123</code>
        </div>
    </div>

    <script>
        function switchTo(type) {
            const btns = document.querySelectorAll('.toggle-btn');
            const action = document.getElementById('actionField');
            const fullname = document.getElementById('fullnameGroup');
            const heading = document.getElementById('formHeading');
            const subtitle = document.getElementById('formSubtitle');
            const submitBtn = document.getElementById('submitBtn');

            if (type === 'login') {
                btns[0].classList.add('active');
                btns[1].classList.remove('active');
                action.value = 'login';
                fullname.style.display = 'none';
                heading.innerText = 'Sign In';
                subtitle.innerText = 'Enterprise Cafeteria Ordering Portal';
                submitBtn.innerHTML = 'Enter Campus Portal &rarr;';
            } else {
                btns[1].classList.add('active');
                btns[0].classList.remove('active');
                action.value = 'register';
                fullname.style.display = 'block';
                heading.innerText = 'Register Account';
                subtitle.innerText = 'Create your student dining credentials';
                submitBtn.innerHTML = 'Create Account &rarr;';
            }
        }
    </script>
</body>
</html>
